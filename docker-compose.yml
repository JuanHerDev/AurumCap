version: "3.9"

services:

  db:
    image: postgres:15
    container_name: aurumcap_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurumcap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./Backend
    container_name: aurumcap_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aurumcap

  redis:
    image: redis:7-alpine
    container_name: aurumcap_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: